name: Notify Telegram on bot.js Update

on:
  push:
    branches:
      - main
    paths:
      - bot.js

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID is missing."
            exit 1
          fi

          MESSAGE=$(cat <<EOF
          📦 GitHub Update Detected

          📄 File: bot.js
          📁 Repository: ${REPOSITORY}
          🌿 Branch: ${BRANCH}
          👤 Updated by: ${ACTOR}
          🔖 Commit: ${COMMIT_SHA}
          📝 Message: ${COMMIT_MESSAGE}

          🔗 https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}

          ⚠️ This notification confirms the GitHub update only. It does not confirm that NxCreator has loaded the new code.
          EOF
          )

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")

          printf '%s' "$RESPONSE" | grep -q '"ok":true'

          echo "Telegram notification sent successfully."