name: Update NxCreator Bot

on:
  push:
    branches:
      - main
    paths:
      - "source/bot.js"
  workflow_dispatch:

jobs:
  update-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read bot.js
        id: bot_code
        run: |
          echo "code<<EOF" >> "$GITHUB_OUTPUT"
          cat source/bot.js >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update NxCreator
        env:
          NXCREATE_MCP_URL: ${{ secrets.NXCREATE_MCP_URL }}
          NXCREATE_API_KEY: ${{ secrets.NXCREATE_API_KEY }}
          NXCREATE_BOT_ID: ${{ secrets.NXCREATE_BOT_ID }}
          BOT_CODE: ${{ steps.bot_code.outputs.code }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import requests

          url = os.environ["NXCREATE_MCP_URL"]
          api_key = os.environ["NXCREATE_API_KEY"]
          bot_id = os.environ["NXCREATE_BOT_ID"]
          code = os.environ["BOT_CODE"]

          payload = {
              "apiKey": api_key,
              "tool": "update_bot_code",
              "arguments": {
                  "botId": bot_id,
                  "code": code,
                  "restart": True
              }
          }

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=120
          )

          print("HTTP:", response.status_code)
          print(response.text)

          if response.status_code >= 400:
              raise SystemExit("NxCreator update failed")
          PY
