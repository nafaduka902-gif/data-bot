name: Update NxCreator Bot

on:
  push:
    branches:
      - main
    paths:
      - "source/bot.js"
  workflow_dispatch:

jobs:
  update-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update NxCreator
        env:
          NXCREATE_MCP_URL: ${{ secrets.NXCREATE_MCP_URL }}
          NXCREATE_API_KEY: ${{ secrets.NXCREATE_API_KEY }}
          NXCREATE_BOT_ID: ${{ secrets.NXCREATE_BOT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import requests

          with open("source/bot.js", "r", encoding="utf-8") as f:
              code = f.read()

          url = os.environ["NXCREATE_MCP_URL"]
          api_key = os.environ["NXCREATE_API_KEY"]
          bot_id = os.environ["NXCREATE_BOT_ID"]

          payload = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                  "name": "update_bot_code",
                  "arguments": {
                      "botId": bot_id,
                      "code": code,
                      "restart": True
                  }
              }
          }

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=120
          )

          print("HTTP:", response.status_code)
          print(response.text)

          if response.status_code >= 400:
              raise SystemExit("NxCreator update failed")
          PY
